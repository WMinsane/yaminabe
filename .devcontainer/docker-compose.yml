services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: Asia/Tokyo
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.0"
    volumes:
      - ..:/workspace:cached
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: sleep infinity

