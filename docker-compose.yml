services:
  db:
    image: postgres:16-alpine
    container_name: yaminabe-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yaminabe_dev}
      POSTGRES_USER: ${POSTGRES_USER:-yaminabe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaminabe_dev_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yaminabe}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:
