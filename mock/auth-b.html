<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaminabe — 認証 B: 左右分割型</title>
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/feed-common.css">
  <link rel="stylesheet" href="styles/auth-b.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header" style="padding: var(--space-2) var(--space-3)">
    <div class="header-logo" style="font-size: var(--font-size-lg)">闇鍋</div>
    <button class="hamburger" aria-label="メニュー"><span></span><span></span><span></span></button>
  </header>

  <main class="auth-split">
    <div class="auth-brand">
      <div class="brand-content">
        <div class="brand-title">闇鍋で視野を広げる</div>
        <div class="brand-desc">
          エコーチェンバーから抜け出し、知らない世界との出会いを。
          パーソナライズとランダム性を両立した、新しい情報発見体験。
        </div>
        <ul class="brand-features">
          <li>興味に合わせたパーソナライズ配信</li>
          <li>温度スライダーでランダム性を調整</li>
          <li>行動履歴とブックマーク管理</li>
          <li>週次カテゴリランキング</li>
        </ul>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-inner">
        <div class="auth-form-title">ログイン</div>
        <div class="form-group">
          <label class="form-label">メールアドレス</label>
          <input class="form-input" type="email" placeholder="mail@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">パスワード</label>
          <input class="form-input" type="password" placeholder="パスワード">
          <div class="form-forgot"><a href="#">パスワードを忘れた方</a></div>
        </div>
        <button class="btn-submit">ログイン</button>
        <div class="auth-switch">
          アカウントをお持ちでない方 <a href="#">新規登録</a>
        </div>
      </div>
    </div>
  </main>

  <button class="theme-toggle" onclick="toggleDark()">暗</button>
  <script>
    function toggleDark() {
      document.documentElement.classList.toggle('dark');
      document.querySelector('.theme-toggle').textContent =
        document.documentElement.classList.contains('dark') ? '明' : '暗';
    }
  </script>
</body>
</html>
