<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaminabe — パスワード変更</title>
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/feed-common.css">
  <link rel="stylesheet" href="styles/password.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header" style="padding: var(--space-2) var(--space-3)">
    <div class="header-logo" style="font-size: var(--font-size-lg)">闇鍋</div>
    <button class="hamburger" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="password-page">
    <div class="password-card">
      <h1 class="password-title">パスワード変更</h1>
      <div class="form-group">
        <label class="form-label" for="new-pw">新しいパスワード</label>
        <input class="form-input" type="password" id="new-pw" placeholder="8文字以上">
        <div class="strength-bar"><div class="strength-fill"></div></div>
        <p class="form-hint">英数字・記号を含む8文字以上</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm-pw">パスワード確認</label>
        <input class="form-input" type="password" id="confirm-pw" placeholder="もう一度入力">
      </div>
      <button class="btn-submit">パスワードを変更</button>
      <a href="feed-hybrid.html" class="back-link">ホームに戻る</a>
    </div>
  </main>

  <button class="theme-toggle" onclick="toggleDark()">暗</button>
  <script>
    function toggleDark() {
      document.documentElement.classList.toggle('dark');
      document.querySelector('.theme-toggle').textContent =
        document.documentElement.classList.contains('dark') ? '明' : '暗';
    }
  </script>
</body>
</html>
