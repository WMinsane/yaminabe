<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaminabe — ランキング B: 全カテゴリ一覧型</title>
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/feed-common.css">
  <link rel="stylesheet" href="styles/ranking-b.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header" style="padding: var(--space-2) var(--space-3)">
    <div class="header-logo" style="font-size: var(--font-size-lg)">闇鍋</div>
    <button class="hamburger" aria-label="メニュー"><span></span><span></span><span></span></button>
  </header>

  <main class="rankall-page" id="feed"></main>

  <button class="theme-toggle" onclick="toggleDark()">暗</button>
  <script>
    function posClass(i) { return i < 3 ? ' top' + (i+1) : ''; }

    fetch('data/feeds.json').then(r=>r.json()).then(feeds => {
      const groups = {};
      feeds.forEach(f => {
        if (!groups[f.category]) groups[f.category] = [];
        groups[f.category].push(f);
      });

      let html = '';
      for (const [cat, items] of Object.entries(groups)) {
        const sorted = [...items].sort((a,b) => b.bookmark_count - a.bookmark_count);
        html += `
          <div class="rankall-card">
            <div class="rankall-card-header">${cat}</div>
            <ul class="rankall-list">
              ${sorted.map((f,i) => `
                <li class="rankall-item">
                  <span class="rankall-pos${posClass(i)}">${i+1}</span>
                  <span class="rankall-title">${f.title}</span>
                  <span class="rankall-users">${f.bookmark_count}u</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      }
      document.getElementById('feed').innerHTML = html;
    });

    function toggleDark() {
      document.documentElement.classList.toggle('dark');
      document.querySelector('.theme-toggle').textContent =
        document.documentElement.classList.contains('dark') ? '明' : '暗';
    }
  </script>
</body>
</html>
